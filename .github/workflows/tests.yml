name: Composition and source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Python syntax
        run: python3 -m compileall -q build.py tools
      - name: Check runtime Lua syntax
        run: find runtime -name '*.lua' -exec luac5.1 -p '{}' \;
      - name: Test Hangul composition and name confirmation
        run: |
          lua5.1 tests/test_hangul.lua
          lua5.1 tests/test_nameinput.lua
