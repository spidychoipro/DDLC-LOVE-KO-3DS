<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="DDLC-LOVE Korean localization for Nintendo 3DS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d13"/>
      <stop offset="0.55" stop-color="#121623"/>
      <stop offset="1" stop-color="#1a1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5c8a"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>

  <rect x="0" y="58" width="1280" height="1" fill="#ff5c8a" opacity="0.18"/>
  <rect x="0" y="238" width="1280" height="1" fill="#a78bfa" opacity="0.18"/>
  <rect x="712" y="86" width="220" height="1" fill="#67e8f9" opacity="0.22"/>
  <rect x="946" y="196" width="180" height="1" fill="#ff5c8a" opacity="0.22"/>

  <g fill="#ff5c8a" opacity="0.9">
    <rect x="72" y="70" width="8" height="8"/>
    <rect x="80" y="62" width="8" height="8"/>
    <rect x="88" y="70" width="8" height="8"/>
    <rect x="80" y="78" width="8" height="8"/>
    <rect x="80" y="94" width="8" height="8"/>
    <rect x="72" y="102" width="8" height="8"/>
    <rect x="88" y="102" width="8" height="8"/>
  </g>

  <text x="120" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="6" fill="#ff8fb1">NINTENDO 3DS</text>

  <text x="118" y="180" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="800" letter-spacing="-1" fill="#f5f7ff" filter="url(#glow)">DDLC-LOVE</text>
  <text x="120" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4" fill="#9aa4bf">KOREAN LOCALIZATION</text>

  <rect x="120" y="238" width="300" height="1" fill="url(#accent)" opacity="0.7"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="960" y="70" width="240" height="40" rx="8" fill="#ff5c8a" fill-opacity="0.10" stroke="#ff5c8a" stroke-opacity="0.55"/>
    <text x="1080" y="96" text-anchor="middle" font-size="16" fill="#ff9dbb">v0.2.7-beta</text>

    <rect x="960" y="122" width="240" height="40" rx="8" fill="#2ea043" fill-opacity="0.10" stroke="#2ea043" stroke-opacity="0.55"/>
    <text x="1080" y="148" text-anchor="middle" font-size="15" fill="#7ee2a8">physical 3DS verified</text>

    <rect x="960" y="174" width="240" height="40" rx="8" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="1080" y="200" text-anchor="middle" font-size="15" fill="#c4b5fd">GPL-3.0</text>
  </g>

  <text x="120" y="278" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#5f6a85">Unofficial personal build. Not affiliated with Team Salvato, LukeZGD, or the Korean patch team.</text>
</svg>
