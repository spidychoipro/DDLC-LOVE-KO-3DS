<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="DDLC-LOVE Korean localization for Nintendo 3DS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfcff"/>
      <stop offset="0.6" stop-color="#f7f5fc"/>
      <stop offset="1" stop-color="#f1edfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5c8a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff5c8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c8a"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5c8a"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="heartClip">
      <path d="M16 29S2 19.5 2 10.5C2 5.8 5.8 2 10.5 2c2.7 0 4.7 1.4 5.5 2.7C16.8 3.4 18.8 2 21.5 2 26.2 2 30 5.8 30 10.5 30 19.5 16 29 16 29z"/>
    </clipPath>
  </defs>

  <rect width="1280" height="280" fill="url(#bg)"/>
  <circle cx="1090" cy="140" r="180" fill="url(#glow)"/>

  <text x="96" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="6" fill="#c2417a">NINTENDO 3DS</text>

  <text x="94" y="158" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#141821">DDLC-LOVE</text>
  <text x="96" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="5" fill="#5b6478">KOREAN LOCALIZATION</text>

  <rect x="96" y="218" width="240" height="2" fill="url(#rule)"/>

  <text x="96" y="250" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6b7488">unofficial personal build</text>

  <g transform="translate(1000,58) scale(5.4)">
    <path d="M16 29S2 19.5 2 10.5C2 5.8 5.8 2 10.5 2c2.7 0 4.7 1.4 5.5 2.7C16.8 3.4 18.8 2 21.5 2 26.2 2 30 5.8 30 10.5 30 19.5 16 29 16 29z" fill="url(#accent)"/>
    <g clip-path="url(#heartClip)">
      <rect x="-4" y="8.5" width="40" height="1.7" fill="#67e8f9" opacity="0.65" transform="translate(2,0)"/>
      <rect x="-4" y="17.5" width="40" height="1.3" fill="#ff5c8a" opacity="0.7" transform="translate(-2,0)"/>
      <rect x="-4" y="23.5" width="40" height="1" fill="#ffffff" opacity="0.35" transform="translate(1,0)"/>
    </g>
  </g>
